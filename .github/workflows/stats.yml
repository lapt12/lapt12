name: Update GitHub stats

on:
  schedule:
    - cron: "0 15 * * *" # 毎日 0:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - data/**
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG cards
        env:
          # プライベートリポジトリを含めるには repo / read:user スコープの PAT を GH_STATS_TOKEN に登録
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
        working-directory: scripts
        run: |
          python build_sections.py
          python generate_stats.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: update stats [skip ci]"
          git push
