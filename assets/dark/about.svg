<svg xmlns="http://www.w3.org/2000/svg" width="900" height="474" viewBox="0 0 900 474" role="img" aria-label="About">
<title>About</title>
<style>
  text { font-family: system-ui, -apple-system, 'Helvetica Neue', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'BIZ UDPGothic', Meiryo, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  /* 既定は最終状態。アニメーションが止まる環境でも内容が欠けないよう、from 側だけを書く */
  .up { animation: up .9s cubic-bezier(.32,.72,0,1) both; }
  .fade { animation: fade .9s cubic-bezier(.32,.72,0,1) both; }
  .draw { transform-box: fill-box; transform-origin: left center; animation: draw 1.1s cubic-bezier(.32,.72,0,1) both; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes draw { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .ink { animation: ink .9s cubic-bezier(.32,.72,0,1) both; }
  @keyframes ink { from { fill-opacity: .14; } }
</style>
<rect width="900" height="474" fill="#141412"/>

<g class="fade" style="animation-delay:0.00s"><line x1="48" y1="39.5" x2="72" y2="39.5" stroke="#a8a49b"/><text x="84" y="44" font-size="13" fill="#f2f0ea"><tspan font-weight="600" letter-spacing="1.8">ABOUT</tspan><tspan dx="8" letter-spacing=".4" fill="#918d84">/ Introduction</tspan></text></g>
<text class="ink" style="animation-delay:0.30s" x="48" y="124" font-size="28" font-weight="700" letter-spacing="-.3" fill="#f2f0ea">Python・Javaなどの言語を中心に、discord内で動くRPGか</text>
<text class="ink" style="animation-delay:0.65s" x="48" y="169" font-size="28" font-weight="700" letter-spacing="-.3" fill="#f2f0ea">ら機械学習を用いた音楽の譜面生成アプリまで幅広く開発して</text>
<text class="ink" style="animation-delay:1.00s" x="48" y="214" font-size="28" font-weight="700" letter-spacing="-.3" fill="#f2f0ea">います。</text>
<text class="ink" style="animation-delay:1.35s" x="48" y="284" font-size="28" font-weight="700" letter-spacing="-.3" fill="#f2f0ea">ワクワクすることを突きつけめることが好きで、興味がある物</text>
<text class="ink" style="animation-delay:1.70s" x="48" y="328" font-size="28" font-weight="700" letter-spacing="-.3" fill="#f2f0ea">事の開発を通して新しい技術を学ぶことを心がけています。最</text>
<text class="ink" style="animation-delay:2.05s" x="48" y="373" font-size="28" font-weight="700" letter-spacing="-.3" fill="#f2f0ea">近はTypeScriptとReactに興味を持ち、言語の枠にとらわれ</text>
<text class="ink" style="animation-delay:2.40s" x="48" y="418" font-size="28" font-weight="700" letter-spacing="-.3" fill="#f2f0ea">ない設計・実装を目指しています。</text>
</svg>