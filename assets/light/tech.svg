<svg xmlns="http://www.w3.org/2000/svg" width="900" height="654" viewBox="0 0 900 654" role="img" aria-label="Tech Stack">
<title>Tech Stack</title>
<style>
  text { font-family: system-ui, -apple-system, 'Helvetica Neue', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'BIZ UDPGothic', Meiryo, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  /* 既定は最終状態。アニメーションが止まる環境でも内容が欠けないよう、from 側だけを書く */
  .up { animation: up .9s cubic-bezier(.32,.72,0,1) both; }
  .fade { animation: fade .9s cubic-bezier(.32,.72,0,1) both; }
  .draw { transform-box: fill-box; transform-origin: left center; animation: draw 1.1s cubic-bezier(.32,.72,0,1) both; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes draw { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .ma { animation: ma 50s linear infinite; }
  .mb { animation: mb 50s linear infinite; }
  @keyframes ma { to { transform: translateX(-2409px); } }
  @keyframes mb { from { transform: translateX(-2409px); } to { transform: translateX(0); } }
</style>
<rect width="900" height="654" fill="#f6f5f1"/>

